# The DMG window layout, machine-readable. make-dmg.sh sources this file.
#
# These are the numbers dmg-assets/dmg-background.png is DRAWN FOR — the arrow
# in the artwork points from one icon slot to the other, so it is wrong the
# moment a slot moves. Prose version and provenance: dmg-layout.txt beside
# this file; the constants themselves live in Tools/IconRender.swift, `enum DMG`.
#
# Change these together with the artwork, never on their own.

WINDOW_W=640          # content size in points
WINDOW_H=400
ICON_SIZE=128

APP_X=168             # centre of the MacPulse.app icon, Finder coordinates
APP_Y=208             # (origin top-left)

APPS_X=472            # centre of the Applications alias
APPS_Y=208
