<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250"
     role="img" aria-label="MacPulse — a system monitor that lives in the MacBook notch">
  <title>MacPulse</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141417"/>
      <stop offset="1" stop-color="#08080A"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#3A3A3F" stop-opacity="0"/>
      <stop offset="0.5"  stop-color="#6E6E76" stop-opacity="1"/>
      <stop offset="1"    stop-color="#3A3A3F" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    /* The dot is the product: one dot, coloured by the kernel's memory
       pressure verdict. Grey calm, amber strained, red already lagging.
       The cycle below is those three states, in that order. */
    @keyframes verdict {
        0%,  16% { fill: #8E8E93; }
       26%,  42% { fill: #FFB020; }
       52%,  68% { fill: #FF453A; }
       78%, 100% { fill: #8E8E93; }
    }
    @keyframes swell {
        0%,  16% { transform: scale(1);    opacity: .85; }
       26%,  42% { transform: scale(1.22); opacity: 1;   }
       52%,  68% { transform: scale(1.42); opacity: 1;   }
       78%, 100% { transform: scale(1);    opacity: .85; }
    }
    @keyframes meter {
        0%, 100% { transform: scaleY(.35); opacity: .35; }
       50%       { transform: scaleY(1.6); opacity: .9;  }
    }
    @keyframes sweep {
        0%   { opacity: 0;  }
       45%   { opacity: .9; }
      100%   { opacity: 0;  }
    }

    .dot   { animation: verdict 6.5s ease-in-out infinite; }
    .dotg  { animation: swell   6.5s ease-in-out infinite;
              transform-origin: 450.0px 17.0px; }
    .bar   { fill: #5A5A62; animation: meter 2.6s ease-in-out infinite; }
    .line  { animation: sweep 6.5s ease-in-out infinite; }

    /* Anyone who asked the system to stop moving things gets a still
       image — the dot simply sits at its calm colour. */
    @media (prefers-reduced-motion: reduce) {
      .dot, .dotg, .bar, .line { animation: none; }
      .dot { fill: #8E8E93; }
    }
  </style>

  <rect width="900" height="250" rx="26" fill="url(#plate)"/>

  <!-- the notch itself, drawn the way the app sees it -->
  <path d="M 350.0 0 h 200 v 20 a 14 14 0 0 1 -14 14
           h -172 a 14 14 0 0 1 -14 -14 Z" fill="#000"/>
  <g class="dotg" filter="url(#glow)">
    <circle class="dot" cx="450.0" cy="17.0" r="5.5" fill="#8E8E93"/>
  </g>

  <text x="450.0" y="120" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="58" font-weight="600" letter-spacing="-1.4" fill="#F2F2F7">MacPulse</text>

  <text x="450.0" y="152" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif"
        font-size="15" font-weight="450" letter-spacing="0.2" fill="#8E8E93">the lag signal no other monitor shows</text>

  <rect class="line" x="170" y="172" width="560" height="1" fill="url(#fade)"/>

