name: Идея
description: Чего не хватает в островке
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Одно правило, которое решает судьбу почти всех идей: **секция островка
        появляется, только когда ей есть что сказать.** Если предложение
        добавляет строку, которая висит всегда, оно почти наверняка не подойдёт —
        но то же самое в виде «показывать, только когда происходит X» подойдёт.

  - type: textarea
    id: idea
    attributes:
      label: Что хотелось бы видеть
    validations:
      required: true

  - type: input
    id: when
    attributes:
      label: Когда это должно появляться
      placeholder: Только когда подключается внешний монитор
