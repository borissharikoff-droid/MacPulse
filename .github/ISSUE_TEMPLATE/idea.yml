name: Idea
description: Something the island is missing
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        One rule decides the fate of almost every idea here: **a section appears
        only when it has something to say.** A proposal that adds a line which is
        always on screen almost certainly won't fit — but the same thing phrased
        as "show it only while X is happening" will.

  - type: textarea
    id: idea
    attributes:
      label: What you'd like to see
    validations:
      required: true

  - type: input
    id: when
    attributes:
      label: When should it appear
      placeholder: Only while an external display is connected
