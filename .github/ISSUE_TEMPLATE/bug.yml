name: Something is wrong
description: The island doesn't appear, the numbers look off, the app quit on its own
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        No need to apologise for a short report. "The island doesn't show up on
        an external display" is already a complete one.

  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: I hover over the notch and nothing opens.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: MacPulse version
      description: Menu bar icon ▸ top line, or "Проверить обновления…"
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: mac
    attributes:
      label: Mac and macOS version
      description: 🍎 ▸ About This Mac
      placeholder: "MacBook Air M1, macOS 15.3"
    validations:
      required: true

  - type: textarea
    id: probe
    attributes:
      label: Diagnostics (optional)
      description: |
        If it's no trouble, paste the output of these. It speeds everything up
        enormously. The output contains: which island sections are currently
        live, the names of apps using a lot of memory, and the launch-at-login
        state. No passwords, no clipboard contents, no event titles.

        ```
        /Applications/MacPulse.app/Contents/MacOS/MacPulse --rail-probe 14
        /Applications/MacPulse.app/Contents/MacOS/MacPulse --login-probe
        ```
      render: text
